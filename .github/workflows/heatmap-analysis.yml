name: Heatmap today's analysis

# Pre-generates 오늘의 분석 for every category heatmap menu tile via Gemini
# Batch (−50%), then commits cache.json so production serves warm columns.
# First-click on a cold slug still uses Live API in the Next.js app (immediate).
#
# Cron: 05:00 KST (after 04:00 briefings start; before morning traffic).
#
# GitHub-hosted runners hard-cap at 6 hours — we cannot raise that. Instead:
#   articles are written to disk continuously, then ONE final cache push runs
#   even when the job is cancelled (timeout). Mid-run pushes stay off by default
#   so Vercel is not billed for dozens of deploys (optional rare git-only
#   backups: ANALYSIS_CHECKPOINT_INTERVAL_MS, commits include [vercel skip]).
#
# Email report → glory2wide@gmail.com after generation. Requires repo secrets:
#   RESEND_API_KEY  OR  SMTP_USER + SMTP_PASS (Gmail app password)
# Without those secrets a GitHub Issue is opened instead of sending Gmail.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "TTL 안이어도 전체 재생성"
        type: boolean
        required: false
        default: false
      channel:
        description: "채널 한정 (entertainment/politics/economy/culture/travel)"
        required: false
        default: ""
      limit:
        description: "생성 상한 (비우면 전체)"
        required: false
        default: ""

concurrency:
  group: heatmap-analysis
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 360 = GitHub-hosted hard maximum (cannot go higher on ubuntu-latest).
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Require Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::GEMINI_API_KEY GitHub secret is missing. Add it under Settings → Secrets."
            exit 1
          fi

      - name: Generate heatmap 오늘의 분석 (Gemini Batch)
        id: generate
        run: |
          set -euo pipefail
          chmod +x scripts/ci-commit-push.sh scripts/ci-checkpoint-analysis-cache.sh
          EDITION="$(TZ=Asia/Seoul date +%F)"
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          ARGS="--date=$EDITION"
          if [ -n "${{ inputs.channel }}" ]; then ARGS="$ARGS --channel=${{ inputs.channel }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "args=$ARGS"
          npx tsx scripts/generate-heatmap-analysis.ts $ARGS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_EDITOR_MODEL: ${{ vars.GEMINI_EDITOR_MODEL }}
          BRIEFING_LLM_PROVIDER: gemini
          LLM_PROVIDER: gemini
          GEMINI_USE_BATCH: "true"
          # Overnight cost: skip expand/repair LLM; local pad only
          ANALYSIS_SKIP_LENGTH_EXPAND: "1"
          ANALYSIS_SKIP_REPAIR_LLM: "1"
          # Optional override; defaults also lowered in generation-policy.ts
          ANALYSIS_RANK_LIMIT_GENERAL: "5"
          ANALYSIS_RANK_LIMIT_SUBSIDY: "8"
          ANALYSIS_CYCLE_HOURS: "72"
          GEMINI_BATCH_CONCURRENCY: "4"
          ANALYSIS_OVERNIGHT_BATCH_SIZE: "20"
          # Mid-run git push OFF (0). Salvage = disk + single final always() push.
          # Set e.g. 10800000 (3h) only if you want rare git backups with [vercel skip].
          ANALYSIS_CHECKPOINT: "1"
          ANALYSIS_CHECKPOINT_INTERVAL_MS: "0"
          CI: "true"
          GEMINI_MAX_CONCURRENCY: "4"
          TRENDS_DATA_SOURCE: live
          # Same search/API keys as ingest + board refresh — without these,
          # news-first boards fall back to URL seeds only and used to fail as sources=0.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Serper disabled (cost). Re-enable with SERPER_ENABLED=1 + SERPER_API_KEY.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_EMAIL_TO: glory2wide@gmail.com

      # Push whatever landed on disk — including when the job was cancelled at 6h.
      - name: Commit and push analysis cache
        if: always() && steps.generate.outcome != 'skipped'
        continue-on-error: true
        run: |
          chmod +x scripts/ci-commit-push.sh scripts/ci-checkpoint-analysis-cache.sh
          scripts/ci-checkpoint-analysis-cache.sh \
            "chore: publish heatmap today's analysis (${{ steps.generate.outputs.edition || 'partial' }})" \
            src/data/analysis/cache.json

      - name: Email heatmap analysis report
        if: always() && steps.generate.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          REPORT_EMAIL_TO: glory2wide@gmail.com
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
        run: |
          chmod +x scripts/ci-email-report.sh
          EDITION="${{ steps.generate.outputs.edition }}"
          if [ -z "$EDITION" ]; then EDITION="$(TZ=Asia/Seoul date +%F)"; fi
          scripts/ci-email-report.sh \
            "artifacts/generation-reports/heatmap-analysis-${EDITION}.html" \
            "[KindexLab] 오늘의 분석 생성 보고 · ${EDITION}"
