name: Premium columns

# Generated columns only reach production by being committed: Vercel's
# filesystem is read-only at runtime, so `writeDisk` bails out there and the
# Vercel cron that calls /api/analysis/generate discards everything it builds.
# Running the generator here and committing the store is what makes the work
# survive — the same pattern the daily briefing job already uses.
on:
  schedule:
    # 05:20 KST, after the 21:15 UTC ingest has refreshed the keyword universe.
    - cron: "20 20 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "생성할 키워드 수 (비우면 전체)"
        required: false
        default: "120"
      channel:
        description: "채널 한정 (entertainment/politics/economy/culture, 비우면 전체)"
        required: false
        default: ""
      purge:
        description: "기존 글 전체 삭제 후 재생성"
        type: boolean
        required: false
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # A full sweep is several hundred keywords at a few seconds each, well past
    # the 6h default but nowhere near it; the cap is here to stop a wedged run
    # from burning a whole day of minutes.
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate columns
        run: |
          ARGS="--date=$(TZ=Asia/Seoul date +%F)"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.channel }}" ]; then ARGS="$ARGS --channel=${{ inputs.channel }}"; fi
          if [ "${{ inputs.purge }}" = "true" ]; then ARGS="$ARGS --purge"; fi
          npx tsx scripts/generate-premium.ts $ARGS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_EDITOR_MODEL: ${{ vars.GEMINI_EDITOR_MODEL }}
          BRIEFING_LLM_PROVIDER: gemini
          LLM_PROVIDER: gemini
          # Overnight premium sweep: coalesce chatJson into Gemini Batch (−50%).
          GEMINI_USE_BATCH: "true"
          GEMINI_BATCH_CONCURRENCY: "4"
          GEMINI_MAX_CONCURRENCY: "4"
          TRENDS_DATA_SOURCE: live
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate premium columns"
          file_pattern: src/data/posts/generated.json
