name: Premium columns

# Generated columns only reach production by being committed: Vercel's
# filesystem is read-only at runtime, so `writeDisk` bails out there and the
# Vercel cron that calls /api/analysis/generate discards everything it builds.
# Running the generator here and committing the store is what makes the work
# survive — the same pattern the daily briefing job already uses.
on:
  schedule:
    # 05:20 KST, after the 21:15 UTC ingest has refreshed the keyword universe.
    - cron: "20 20 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "생성할 키워드 수 (비우면 전체)"
        required: false
        default: "120"
      channel:
        description: "채널 한정 (entertainment/politics/economy/culture, 비우면 전체)"
        required: false
        default: ""
      purge:
        description: "기존 글 전체 삭제 후 재생성"
        type: boolean
        required: false
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # A full sweep is several hundred keywords at a few seconds each, well past
    # the 6h default but nowhere near it; the cap is here to stop a wedged run
    # from burning a whole day of minutes.
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate columns
        id: generate
        run: |
          EDITION="$(TZ=Asia/Seoul date +%F)"
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          ARGS="--date=$EDITION"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.channel }}" ]; then ARGS="$ARGS --channel=${{ inputs.channel }}"; fi
          if [ "${{ inputs.purge }}" = "true" ]; then ARGS="$ARGS --purge"; fi
          npx tsx scripts/generate-premium.ts $ARGS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_EDITOR_MODEL: ${{ vars.GEMINI_EDITOR_MODEL }}
          BRIEFING_LLM_PROVIDER: gemini
          LLM_PROVIDER: gemini
          # Overnight premium sweep: coalesce chatJson into Gemini Batch (−50%).
          GEMINI_USE_BATCH: "true"
          GEMINI_BATCH_CONCURRENCY: "4"
          GEMINI_MAX_CONCURRENCY: "4"
          TRENDS_DATA_SOURCE: live
          REPORT_EMAIL_TO: glory2wide@gmail.com

      - name: Email premium column report
        if: always() && steps.generate.outcome != 'skipped'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          REPORT_EMAIL_TO: glory2wide@gmail.com
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
        run: |
          chmod +x scripts/ci-email-report.sh
          EDITION="${{ steps.generate.outputs.edition }}"
          if [ -z "$EDITION" ]; then EDITION="$(TZ=Asia/Seoul date +%F)"; fi
          scripts/ci-email-report.sh \
            "artifacts/generation-reports/premium-${EDITION}.html" \
            "[KindexLab] 이슈칼럼 생성 보고 · ${EDITION}"

      - name: Commit and push columns
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh "chore: regenerate premium columns" src/data/posts/generated.json
