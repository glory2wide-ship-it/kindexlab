name: Refresh ranking boards

# Rebuilds expired LLM/RSS boards and commits published.json so production
# heatmaps (경제·문화·여행 desks without ingest coverage) can move.
# Cost controls: Gemini Batch (−50%), expired-only picks, skip polish/pump,
# 6h cadence, 24h TTL.

on:
  schedule:
    # Every 6 hours — was hourly; expired-only + longer TTL covers the set.
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Boards to refresh this run"
        required: false
        default: "4"

concurrency:
  group: refresh-ranking-boards
  cancel-in-progress: false

jobs:
  boards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh stale boards and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Serper disabled (cost). Re-enable with SERPER_ENABLED=1 + SERPER_API_KEY.
          BOARDS_CHAIN_ENABLED: "1"
          TRENDS_DATA_SOURCE: live
          # −50% vs Live for board LLM calls
          GEMINI_USE_BATCH: "true"
          # Prefer freshness window over thrashing warm boards
          BOARDS_TTL_HOURS: "24"
          # Skip optional editor / shorts LLM steps (template pump kept)
          BOARDS_SKIP_POLISH: "1"
          BOARDS_SKIP_PUMP: "1"
        run: |
          LIMIT="${{ github.event.inputs.limit || '4' }}"
          npx tsx scripts/refresh-stale-boards.ts --limit="$LIMIT"
      - name: Commit and push published boards
        if: success()
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh "chore: refresh published ranking boards" src/data/boards/published.json
