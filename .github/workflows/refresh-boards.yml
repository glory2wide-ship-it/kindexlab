name: Refresh ranking boards

# Rebuilds a rotating batch of LLM/RSS boards and commits published.json so
# production heatmaps (경제·문화·여행 desks without ingest coverage) can move.

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Boards to refresh this run"
        required: false
        default: "4"

concurrency:
  group: refresh-ranking-boards
  cancel-in-progress: false

jobs:
  boards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh stale boards and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BOARDS_CHAIN_ENABLED: "1"
          TRENDS_DATA_SOURCE: live
        run: |
          LIMIT="${{ github.event.inputs.limit || '4' }}"
          npx tsx scripts/refresh-stale-boards.ts --limit="$LIMIT"
      - name: Commit and push published boards
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh "chore: refresh published ranking boards" src/data/boards/published.json
