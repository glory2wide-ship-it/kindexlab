name: Daily briefings

# Publishes the KST calendar day's full edition (channel mains + submenu
# deep-dives) into src/data/briefings/extra.json via Gemini Batch (−50%),
# then commits so Vercel can deploy.
#
# Cron is 04:00 KST so Batch + auto-commit + Vercel build can finish
# before readers hit the site around 07:00 KST.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "같은 날짜 에디션이 있어도 재생성"
        type: boolean
        required: false
        default: false
      edition_date:
        description: "에디션 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        required: false
        default: ""

concurrency:
  group: daily-briefings
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for rebase against concurrent ingest commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Require Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::GEMINI_API_KEY GitHub secret is missing. Add it under Settings → Secrets."
            exit 1
          fi

      - name: Generate KST daily briefings + deep-dives (Gemini Batch)
        # Do not use `npm run briefing:generate` — that script loads --env-file=.env.local,
        # which does not exist on Actions runners and exits before generation starts.
        id: generate
        run: |
          set -euo pipefail
          EDITION="${{ inputs.edition_date }}"
          if [ -z "$EDITION" ]; then
            EDITION="$(TZ=Asia/Seoul date +%F)"
          fi
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          ARGS="--batch $EDITION"
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force $ARGS"
          fi
          echo "edition=$EDITION force=${{ inputs.force }} batch=1"
          npx tsx scripts/generate-briefings.ts $ARGS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_EDITOR_MODEL: ${{ vars.GEMINI_EDITOR_MODEL }}
          BRIEFING_LLM_PROVIDER: gemini
          LLM_PROVIDER: gemini
          GEMINI_USE_BATCH: "true"
          GEMINI_BATCH_CONCURRENCY: "4"
          BRIEFING_OVERNIGHT_BATCH_SIZE: "12"
          GEMINI_MAX_CONCURRENCY: "4"
          TRENDS_DATA_SOURCE: live
          REPORT_EMAIL_TO: glory2wide@gmail.com

      - name: Email briefing generation report
        if: always() && steps.generate.outcome != 'skipped'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          REPORT_EMAIL_TO: glory2wide@gmail.com
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
        run: |
          chmod +x scripts/ci-email-report.sh
          EDITION="${{ steps.generate.outputs.edition }}"
          if [ -z "$EDITION" ]; then EDITION="$(TZ=Asia/Seoul date +%F)"; fi
          scripts/ci-email-report.sh \
            "artifacts/generation-reports/briefings-${EDITION}.html" \
            "[KindexLab] 브리핑·심층분석 생성 보고 · ${EDITION}"

      # ingest-trends pushes every few minutes; plain auto-commit push races and drops the edition.
      - name: Commit and push briefings
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh "chore: publish KST daily briefings" src/data/briefings/extra.json
