name: Daily briefings

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run briefing:generate
        env:
          # All article generation uses Gemini (live or Batch).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_EDITOR_MODEL: ${{ vars.GEMINI_EDITOR_MODEL }}
          BRIEFING_LLM_PROVIDER: gemini
          LLM_PROVIDER: gemini
          GEMINI_USE_BATCH: "true"
          GEMINI_BATCH_CONCURRENCY: "4"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish KST daily briefings"
          file_pattern: src/data/briefings/extra.json
