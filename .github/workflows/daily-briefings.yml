name: Daily briefings

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run briefing:generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish KST daily briefings"
          file_pattern: src/data/briefings/extra.json
