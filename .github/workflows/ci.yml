name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run landing:check
      - run: npm run briefing:check
      - name: Trends health (live source + fresh snapshot)
        run: npm run trends:health
        env:
          TRENDS_DATA_SOURCE: live
          TRENDS_REQUIRE_LIVE: "1"
      - run: npm run live:first
      - run: npm run live:gates
