name: Ingest live trends

on:
  schedule:
    # Every 10 minutes — ingest often takes 2–5m; tighter crons overlap and race on push.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Only one ingest writer at a time; newer runs cancel stale overlaps.
concurrency:
  group: ingest-live-trends
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest live trends
        id: ingest
        run: npm run ingest:trends
        env:
          TRENDS_DATA_SOURCE: live
          TRENDS_REQUIRE_LIVE: "1"
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Verify snapshot health
        if: always() && steps.ingest.outcome == 'success'
        run: npm run trends:health -- --post-ingest
        env:
          TRENDS_DATA_SOURCE: live
          TRENDS_REQUIRE_LIVE: "1"
      - name: Commit and push snapshot
        if: success()
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh "chore: refresh live entertainment snapshot" src/data/ingestion/snapshot.json
